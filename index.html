<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتال جلسات MCSE</title>
    
    <!-- استفاده از سرورهای قدرتمند گوگل برای لود قطعی فونت -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;800&display=swap" rel="stylesheet">

    <style>
        /* تنظیمات رنگی تم تاریک و مدرن */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --hover-bg: #0284c7;
        }

        /* اعمال اجباری فونت به تمام عناصر صفحه */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
            /* پس‌زمینه با یک گرادینت ملایم */
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            font-weight: 800 !important;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 400 !important;
        }

        /* ساختار گرید برای چیدمان مرتب دکمه‌ها */
        .episodes-grid {
            display: grid;
            /* هر دکمه حداقل 120 پیکسل عرض دارد و خودش را با صفحه تطبیق می‌دهد */
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
        }

        /* استایل دکمه‌های اپیزود */
        .episode-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(56, 189, 248, 0.1);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* انیمیشن ظاهر شدن */
            animation: fadeIn 0.5s ease-out backwards;
            cursor: pointer;
        }

        /* افکت جذاب هنگام رفتن موس روی دکمه */
        .episode-card:hover {
            transform: translateY(-8px);
            background-color: var(--hover-bg);
            border-color: var(--accent-color);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
        }

        .episode-number {
            font-size: 2.5rem;
            font-weight: 800 !important;
            margin-bottom: 0.2rem;
            line-height: 1;
        }

        .episode-title {
            font-size: 1rem;
            font-weight: 500 !important;
            opacity: 0.9;
        }

        /* انیمیشن‌ها */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>پورتال جلسات MCSE</h1>
        <p>برای مشاهده هر اپیزود، روی شماره آن کلیک کنید</p>
    </div>

    <div class="episodes-grid" id="grid">
        <!-- دکمه‌ها در اینجا توسط جاوااسکریپت ساخته می‌شوند -->
    </div>

    <script>
        const grid = document.getElementById('grid');
        
        // --- تنظیمات اصلی ---
        const startEpisode = 0; // شماره اولین اپیزود
        const totalEpisodes = 13; // شماره آخرین اپیزود (هر زمان خواستی زیادش کن)
        
        const baseUrl = './episodes/e';
        const domain = '.html';

        // حلقه سازنده دکمه‌ها
        for (let i = startEpisode; i <= totalEpisodes; i++) {
            const a = document.createElement('a');
            
            // ساخت URL داینامیک برای هر اپیزود
            a.href = `${baseUrl}${i}${domain}`;
            
            a.className = 'episode-card';
            
            // این خط باعث میشه هر دکمه با کمی تاخیر نسبت به قبلی ظاهر بشه (افکت زیبا)
            a.style.animationDelay = `${i * 0.05}s`; 
            
            a.innerHTML = `
                <div class="episode-number">${i}</div>
                <div class="episode-title">اپیزود</div>
            `;
            
            grid.appendChild(a);
        }
    </script>
</body>
</html>
